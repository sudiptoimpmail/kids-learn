name: Stage missing landmark photographs for visual review
on:
  push:
    branches: [feat/phase17-media-completion-hardening-20261106]
    paths:
      - '.github/workflows/stage-missing-landmark-review.yml'
      - 'scripts/prepare-landmark-batch.py'
      - 'scripts/stage-missing-landmark-review.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase17-landmark-media
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase17-media-completion-hardening-20261106
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Acquire additional real candidate images
        env:
          MAX_LANDMARK_CANDIDATES: '37'
          LANDMARK_REQUEST_DELAY: '0.5'
        run: python scripts/stage-missing-landmark-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase17-landmark-photo-candidates
          path: tests/out/landmark-batch/
          retention-days: 30
      - name: Commit additional review-only binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landmark-candidates/ docs/landmark-candidate-review.json
          git diff --cached --quiet && exit 0
          git commit -m 'media: add further real landmark photo candidates for review'
          git fetch origin feat/phase17-media-completion-hardening-20261106
          git rebase origin/feat/phase17-media-completion-hardening-20261106
          git push origin HEAD:feat/phase17-media-completion-hardening-20261106
