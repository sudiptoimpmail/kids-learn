name: Stage two landmark photos in review PR
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/phase14-ship-two-offline-landmark-photos-20261106
    paths:
      - 'scripts/stage-two-landmark-photos.py'
      - '.github/workflows/stage-two-landmark-photos.yml'
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'feat/phase14-ship-two-offline-landmark-photos-20261106' || github.ref_name == 'feat/phase14-ship-two-offline-landmark-photos-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase14-ship-two-offline-landmark-photos-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Download and stage verified-source photos
        run: |
          if [ -f assets/landmark-photos/liberty.webp ] && [ -f assets/landmark-photos/eiffel.webp ]; then
            echo 'Already staged'; exit 0
          fi
          python scripts/stage-two-landmark-photos.py
      - name: Validate provenance and offline image files
        run: |
          node tests/landmark-photo-provenance-test.cjs
          node scripts/audit-content.cjs
      - name: Commit actual WebP files to this review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landmark-photos/ data/landmark-photos.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'media: bundle two source-verified CC0 landmark photographs for review'
          git push origin HEAD:feat/phase14-ship-two-offline-landmark-photos-20261106
