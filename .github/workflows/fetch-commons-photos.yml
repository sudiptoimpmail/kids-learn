name: Fetch Commons photos
# Runs when a media/* branch is pushed: downloads the Wikimedia Commons files
# listed in media/commons-fetch.json, converts them to WebP and commits them
# back to the same branch so they ship inside the app (offline).
on:
  push:
    branches: ['media/**']
    paths: ['media/commons-fetch.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/fetch-commons-photos.py
      - name: Commit photos
        run: |
          git config user.name "commons-photo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets media
          git diff --cached --quiet || git commit -m "Add Commons photos from media/commons-fetch.json [skip ci]"
          git push
