name: Stage all remaining landmark candidates in this PR
on:
  push:
    branches: [feat/phase16-full-media-release-batch-20261106]
    paths:
      - '.github/workflows/stage-all-landmark-review.yml'
      - 'scripts/prepare-landmark-batch.py'
      - 'scripts/stage-landmark-review.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    if: github.ref_name == 'feat/phase16-full-media-release-batch-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-full-media-release-batch-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Fetch and stage real Wikimedia Commons image candidates
        env:
          MAX_LANDMARK_CANDIDATES: '37'
          LANDMARK_REQUEST_DELAY: '0.5'
        run: python scripts/stage-landmark-review.py
      - name: Upload all candidate images and review report
        uses: actions/upload-artifact@v4
        with:
          name: all-remaining-landmark-candidates-review
          path: tests/out/landmark-batch/
          retention-days: 30
      - name: Commit candidate binaries to review-only branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landmark-candidates/ docs/landmark-candidate-review.json
          git diff --cached --quiet && exit 0
          git commit -m 'media: stage real landmark candidates for individual visual and license review'
          git push origin HEAD:feat/phase16-full-media-release-batch-20261106
